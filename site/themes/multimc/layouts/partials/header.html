<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if .IsHome }}{{ .Title }}{{ else }}{{ .Title }} &middot; {{ .Site.Title }}{{ end }}</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#8cc14c">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" type="text/css" href="/assets/css/uikit.multimc.min.css">
    <link rel="stylesheet" type="text/css" href="//fonts.googleapis.com/css?family=Droid+Sans">
    <link rel="stylesheet" type="text/css" href="/assets/css/bxslider/jquery.bxslider.css">
    {{ with .OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" title="{{ $.Site.Title }}" href="{{ .Permalink }}" />{{ end }}
    <script src="//ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
    <script src="/assets/js/uikit.min.js"></script>
    <script src="/assets/js/bxslider/jquery.bxslider.min.js"></script>
    <style>
        iframe {
            background-color: transparent;
            border: none;
        }
        /* The cat sits on the header's bottom edge, its lower half hidden behind the page */
        .header-inner {
            position: relative;
        }
        .cat-peek {
            position: absolute;
            right: 20px;
            bottom: -16px;
            height: 64px;
            width: auto;
        }
        /* Narrow screens, with the menu button: the logo and name centered between the button
           (left) and a smaller cat (right) */
        @media (max-width: 767px) {
            .header-inner {
                text-align: center;
            }
            .header-inner .uk-navbar-toggle {
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                height: auto;
            }
            .header-inner .uk-navbar-brand {
                float: none;
                display: inline-block;
            }
            .cat-peek {
                right: 0;
                height: 48px;
            }
        }
        /* The narrowest phones: a smaller cat still, so it doesn't sit on the name */
        @media (max-width: 359px) {
            .cat-peek {
                height: 34px;
            }
        }
    </style>
</head>
<body>
{{ partial "logo.html" . }}
    <div class="uk-container uk-container-center uk-margin-top">
        <div data-uk-grid-margin class="uk-grid">
            {{ partial "sidemenu.html" . }}
                <div class="uk-width-medium-3-4">
                    <!--include ads/top.html-->
