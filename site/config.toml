baseURL = "https://multimc.org/"
locale = "en-us"
title = "MultiMC"
theme = "multimc"
uglyurls = true

disableKinds = ["taxonomy", "term", "sitemap"]

# Posts have raw HTML in them (images with attributes)
[markup.goldmark.renderer]
unsafe = true

[outputFormats]
[outputFormats.RSS]
mediatype = "application/rss"
baseName = "rss"